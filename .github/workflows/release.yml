name: Build and publish TFO release

on:
  push:
    branches: [main]
    paths:
      - plugins/tfo/.codex-plugin/plugin.json
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tfo-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'laredson/TFO'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set a canonical temporary directory for worktree tests
        shell: pwsh
        run: |
          $testTemp = 'C:\tfo-test-temp'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "TMP=$testTemp" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build plugin
        run: node scripts/build-plugin.mjs
      - name: Validate runtime and package
        run: node --test --test-concurrency=1 runtime/tests/*.test.mjs scripts/tests/*.test.mjs
      - name: Build local and portable archives
        run: python scripts/package-release.py
      - name: Publish release and assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $manifest = Get-Content plugins/tfo/.codex-plugin/plugin.json -Raw | ConvertFrom-Json
          $version = $manifest.version.Split('+')[0]
          if ($version -notmatch '^\d+\.\d+\.\d+(?:-rc\.\d+)?$') { throw 'Unexpected release version' }
          $tag = "v$version"
          $notes = Join-Path $env:RUNNER_TEMP 'tfo-release-notes.md'
          $changelog = Get-Content docs/RELEASE_NOTES.md -Raw
          $pattern = '(?ms)^## ' + [regex]::Escape($version) + ' — ([^\r\n]+)\r?\n(.*?)(?=^## |\z)'
          $entry = [regex]::Match($changelog, $pattern)
          if (-not $entry.Success) { throw 'Release notes for this version are missing' }
          [IO.File]::WriteAllText($notes, $entry.Groups[2].Value.Trim())
          $title = "TFO $version — " + $entry.Groups[1].Value.Trim()
          $args = @('release', 'create', $tag, "dist/tfo-$version-local.zip", "dist/tfo-$version-portable.zip", 'dist/SHA256SUMS.txt', '--repo', $env:GITHUB_REPOSITORY, '--target', $env:RELEASE_COMMIT, '--title', $title, '--notes-file', $notes)
          if ($version.Contains('-')) { $args += @('--prerelease', '--latest=false') }
          & gh @args
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing releases are never overwritten' }
